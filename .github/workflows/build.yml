name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Test rules
        run: npm run test:rules
      - name: Fuzz rules
        run: npm run test:fuzz -- --iterations 5000 --seed 20260923
      - name: Build
        run: npm run build
